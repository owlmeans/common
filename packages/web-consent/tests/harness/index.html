<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@owlmeans/web-consent</title>
    <!--
      The bootstrap script is injected HERE, above the module below, because that is the only
      placement that makes Consent Mode mean anything: a tag reads the state present when it loads,
      so a decision pushed from a React bundle arrives after everything on the page has acted.

      It is injected by the harness server's `transformIndexHtml`, exactly as `manager-web`'s vite
      plugin, the template's rollup config and the Astro layout do — so the string under test is
      the one `consentBootstrapScript()` emits, inline and classic, not a copy and not a deferred
      module.
    -->
    <!--owlmeans:consent-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/mount.tsx"></script>
  </body>
</html>
